apiVersion: 1
groups:
    - orgId: 1
      name: "\tCertiWatch Monitoring"
      folder: CertiWatch
      interval: 1m
      rules:
        - uid: eg5okoi6oyupse
          title: CertiWatch Security Alert
          condition: C
          data:
            - refId: A
              queryType: table
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: eg5ogrljgh534c
              model:
                intervalMs: 1000
                maxDataPoints: 43200
                queryText: |-
                    SELECT
                        CAST(strftime('%s', 'now') AS INTEGER) AS time,
                        COUNT(*) AS alert_count
                    FROM scan_results
                    WHERE id IN (
                        SELECT MAX(id)
                        FROM scan_results
                        GROUP BY target, port
                    )
                    AND (
                        days_remaining <= 30
                        OR security_status != 'HEALTHY'
                    );
                queryType: table
                rawQueryText: |-
                    SELECT
                        CAST(strftime('%s', 'now') AS INTEGER) AS time,
                        COUNT(*) AS alert_count
                    FROM scan_results
                    WHERE id IN (
                        SELECT MAX(id)
                        FROM scan_results
                        GROUP BY target, port
                    )
                    AND (
                        days_remaining <= 30
                        OR security_status != 'HEALTHY'
                    );
                refId: A
                timeColumns:
                    - time
                    - ts
            - refId: B
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: |-
                One or more monitored services require security attention.
                Please review the CertiWatch dashboard.
            summary: CertiWatch Security Alert
          isPaused: false
          notification_settings:
            receiver: empty
